<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hasil Pencarian Citra Medis</title>
    <style>
        /* ==== GLOBAL STYLE ==== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #d4e8f8, #f4f9ff);
            color: #333;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 0;
        }

        /* ==== CARD CONTAINER ==== */
        .container {
            background: white;
            width: 90%;
            max-width: 1100px;
            padding: 40px 50px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #006ecf;
            font-size: 26px;
            margin-bottom: 25px;
        }

        h3 {
            color: #004b87;
            font-size: 18px;
            margin-bottom: 10px;
        }

        /* ==== QUERY IMAGE ==== */
        .query {
            margin-bottom: 30px;
        }

        .query img {
            width: 220px;
            height: 220px;
            border-radius: 10px;
            border: 3px solid #0078d7;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .query img:hover {
            transform: scale(1.05);
        }

        /* ==== PREDICTION ==== */
        .predicted {
            font-size: 20px;
            margin-bottom: 30px;
            background: #f0f8ff;
            padding: 12px 25px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .predicted span {
            font-weight: bold;
            color: #0078d7;
        }

        /* ==== RESULTS GRID ==== */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            justify-items: center;
            margin-top: 20px;
        }

        .result-card {
            background: #f9fcff;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            width: 190px;
        }

        .result-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }

        .result-card img {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            border: 2px solid #0078d7;
            object-fit: cover;
        }

        p.score {
            margin-top: 6px;
            font-size: 14px;
            color: #333;
        }

        /* ==== BUTTON ==== */
        a button {
            margin-top: 35px;
            background: linear-gradient(135deg, #0078d7, #005fa3);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        a button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #005fa3, #004b87);
        }

        /* ==== FOOTER ==== */
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #777;
        }

        .footer span {
            color: #0078d7;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🩺 Hasil Pencarian Gambar Serupa</h2>

        <div class="query">
            <h3>Gambar yang kamu unggah:</h3>
            <img src="{{ query_image }}" alt="Query Image">
        </div>

        <div class="predicted">
            Prediksi Kelas Tertinggi: <span>{{ predicted_class }}</span>
        </div>

        <h3>Gambar Paling Mirip:</h3>
        <div class="results">
            {% for item in results %}
                <div class="result-card">
                    <img src="{{ item.path }}" alt="Similar Image">
                    <p class="score">Skor: {{ item.score }}</p>
                </div>
            {% endfor %}
        </div>

        <a href="/"><button>← Kembali ke Halaman Utama</button></a>

        <div class="footer">
            © 2025 <span>Image Retrieval System</span> — Semua Hak Dilindungi
        </div>
    </div>
</body>
</html>
